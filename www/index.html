<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131f">
<title>Budbud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=DM+Mono:wght@500&display=swap">
<style>
body{margin:0}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-screen phone game. Slim HUD on top, 400x640 canvas scaled to fit below, hint line at the bottom. */
:root {
  --ink: #10131f;
  --panel: #1a1f33;
  --line: #2b3250;
  --text: #eef1ff;
  --muted: #8d96bd;
  --accent: #ffc145;
  --danger: #ff5a5f;
  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--display);
  padding-inline: 16px;
  padding-block: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.hud {
  width: min(100%, 440px);
  display: grid;
  grid-template-columns: repeat(3, 1fr) auto;
  gap: 4px 14px;
  align-items: end;
}
.stat { display: flex; flex-direction: column; min-width: 0; }
.lbl {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat b {
  font-size: 24px;
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
#restart {
  font: 800 14px/1 var(--display);
  color: var(--ink);
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.drop {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
}
#pips { display: flex; gap: 6px; }
.pip { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.pip.on { background: var(--accent); }
.warn .pip.on { background: var(--danger); }
#stage {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#frame { position: relative; border-radius: 14px; overflow: hidden; background: var(--panel); }
#c { display: block; width: 100%; height: 100%; touch-action: none; }
#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(16, 19, 31, .8);
  padding: 16px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  max-width: 100%;
}
.card h1 { margin: 0; font-size: 32px; font-weight: 800; text-wrap: balance; }
.card p { margin: 0 0 8px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.card button {
  font: 800 16px/1 var(--display);
  color: var(--ink);
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  padding: 12px 24px;
  cursor: pointer;
}
.hint { margin: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; text-wrap: balance; }
</style>

<header class="hud">
  <div class="stat"><span class="lbl">Score</span><b id="score">0</b></div>
  <div class="stat"><span class="lbl">Best</span><b id="best">0</b></div>
  <div class="stat"><span class="lbl">Level</span><b id="level">1</b></div>
  <button id="restart" type="button">New game</button>
  <div class="drop" id="drop"><span class="lbl">Ceiling drops in</span><div id="pips"></div></div>
</header>
<main id="stage">
  <div id="frame">
    <canvas id="c" aria-label="Budbud bubble shooter game board"></canvas>
    <div id="overlay" hidden>
      <div class="card">
        <h1 id="ovTitle">Game over</h1>
        <p id="ovText"></p>
        <button id="ovBtn" type="button">Play again</button>
      </div>
    </div>
  </div>
</main>
<p class="hint">Drag to aim, release to shoot. Tap the small bubble to swap. Match 3 or more.</p>

<script>
(() => {
  const W = 400, H = 640, COLS = 10, R = 20, RH = R * Math.sqrt(3);
  const DANGER = 548, SX = W / 2, SY = 596, NX = SX - 100, NY = SY + 4;
  const SPEED = 900, DROP = 5;
  const BG = '#161a2c', PANEL = '#1d2238', DANGERC = '#ff5a5f';
  // light, base, dark per colour
  const PAL = [
    ['#ff9a9a', '#ff4d5a', '#a8203a'],
    ['#ffe08a', '#ffbb33', '#b57a0e'],
    ['#9bf5c8', '#2fd48a', '#12805a'],
    ['#a6e6ff', '#38b6f5', '#1a6fa8'],
    ['#cdb5ff', '#8f61f5', '#4d2aa8'],
    ['#ffb8e2', '#ff6fc1', '#a82d7c']
  ];

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const frame = document.getElementById('frame'), stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const $ = id => document.getElementById(id);

  let grid = [], flip = 0, level = 1, score = 0, best = 0, misses = 0, nCols = 4;
  let cur = 0, nxt = 0, b = null, fx = [], state = 'aim', aim = Math.PI / 2, down = false;

  try { best = +localStorage.getItem('budbud-best') || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('budbud-best', String(best)); } catch (e) {} }

  const isShort = r => ((r + flip) & 1) === 1;
  const rowLen = r => isShort(r) ? COLS - 1 : COLS;
  const cellPos = (r, c) => [R + c * 2 * R + (isShort(r) ? R : 0), R + r * RH];
  const emptyRow = n => new Array(n).fill(null);

  function nbrs(r, c) {
    const s = isShort(r);
    const o = [[r, c - 1], [r, c + 1]];
    for (const rr of [r - 1, r + 1]) {
      if (s) o.push([rr, c], [rr, c + 1]); else o.push([rr, c - 1], [rr, c]);
    }
    return o.filter(([rr, cc]) => rr >= 0 && rr < grid.length && cc >= 0 && cc < rowLen(rr));
  }

  function presentColors() {
    const s = new Set();
    for (const row of grid) for (const v of row) if (v != null) s.add(v);
    return [...s];
  }
  function pick() {
    const p = presentColors();
    const pool = p.length ? p : [...Array(nCols).keys()];
    return pool[Math.random() * pool.length | 0];
  }

  function startLevel() {
    nCols = Math.min(3 + level, 6);
    const rows = Math.min(4 + level, 8);
    flip = 0; grid = [];
    for (let r = 0; r < rows; r++) {
      grid.push(Array.from({ length: rowLen(r) }, () => Math.random() * nCols | 0));
    }
    misses = 0; fx = []; b = null;
    cur = pick(); nxt = pick();
    state = 'aim';
    overlay.hidden = true;
    hud();
  }
  function newGame() { level = 1; score = 0; startLevel(); }

  function hud() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('level').textContent = level;
    const left = DROP - misses;
    $('pips').innerHTML = Array.from({ length: DROP }, (_, i) => '<span class="pip' + (i < left ? ' on' : '') + '"></span>').join('');
    $('drop').classList.toggle('warn', left === 1);
  }

  function addRow() {
    flip ^= 1;
    const row = Array.from({ length: rowLen(0) }, () => pick());
    grid.unshift(row);
  }

  function collide(x, y) {
    const rr = Math.floor((y - R) / RH);
    const lim = (1.84 * R) ** 2;
    for (let r = Math.max(0, rr - 1); r <= Math.min(grid.length - 1, rr + 2); r++) {
      for (let c = 0; c < grid[r].length; c++) {
        if (grid[r][c] == null) continue;
        const [px, py] = cellPos(r, c);
        if ((px - x) ** 2 + (py - y) ** 2 < lim) return true;
      }
    }
    return false;
  }

  function snap() {
    const r0 = Math.max(0, Math.round((b.y - R) / RH));
    while (grid.length <= r0 + 1) grid.push(emptyRow(rowLen(grid.length)));
    let bestC = null, bd = 1e9, bestAny = null, bad = 1e9;
    for (let r = Math.max(0, r0 - 1); r <= r0 + 1; r++) {
      for (let c = 0; c < rowLen(r); c++) {
        if (grid[r][c] != null) continue;
        const [x, y] = cellPos(r, c);
        const d = (x - b.x) ** 2 + (y - b.y) ** 2;
        if (d < bad) { bad = d; bestAny = [r, c]; }
        if ((r === 0 || nbrs(r, c).some(([a, e]) => grid[a][e] != null)) && d < bd) { bd = d; bestC = [r, c]; }
      }
    }
    return bestC || bestAny;
  }

  function cluster(r, c) {
    const col = grid[r][c], seen = new Set([r + ',' + c]), q = [[r, c]], out = [];
    while (q.length) {
      const [a, e] = q.pop(); out.push([a, e]);
      for (const [x, y] of nbrs(a, e)) {
        const k = x + ',' + y;
        if (!seen.has(k) && grid[x][y] === col) { seen.add(k); q.push([x, y]); }
      }
    }
    return out;
  }

  function attached() {
    const seen = new Set(), q = [];
    if (grid.length) for (let c = 0; c < grid[0].length; c++) if (grid[0][c] != null) { seen.add('0,' + c); q.push([0, c]); }
    while (q.length) {
      const [a, e] = q.pop();
      for (const [x, y] of nbrs(a, e)) {
        const k = x + ',' + y;
        if (!seen.has(k) && grid[x][y] != null) { seen.add(k); q.push([x, y]); }
      }
    }
    return seen;
  }

  const trim = () => { while (grid.length && grid[grid.length - 1].every(v => v == null)) grid.pop(); };
  const isEmpty = () => grid.every(row => row.every(v => v == null));
  function overLimit() {
    for (let r = 0; r < grid.length; r++) {
      if (R + r * RH + R > DANGER && grid[r].some(v => v != null)) return true;
    }
    return false;
  }

  function land() {
    const [r, c] = snap();
    const col = b.col;
    grid[r][c] = col; b = null;
    const cl = cluster(r, c);
    if (cl.length >= 3) {
      for (const [rr, cc] of cl) {
        const [x, y] = cellPos(rr, cc);
        fx.push({ k: 'pop', x, y, col, t: 0 });
        grid[rr][cc] = null;
      }
      score += cl.length * 10 + (cl.length - 3) * 10;
      const att = attached();
      for (let rr = 0; rr < grid.length; rr++) {
        for (let cc = 0; cc < grid[rr].length; cc++) {
          const v = grid[rr][cc];
          if (v != null && !att.has(rr + ',' + cc)) {
            const [x, y] = cellPos(rr, cc);
            fx.push({ k: 'fall', x, y, vx: (Math.random() - .5) * 140, vy: -90 - Math.random() * 120, col: v });
            grid[rr][cc] = null; score += 20;
          }
        }
      }
    } else {
      misses++;
      if (misses >= DROP) { misses = 0; addRow(); }
    }
    trim();
    if (score > best) { best = score; saveBest(); }
    if (isEmpty()) { state = 'win'; show('win'); }
    else if (overLimit()) { state = 'over'; show('over'); }
    else { nxt = pick(); state = 'aim'; }
    hud();
  }

  function show(kind) {
    $('ovTitle').textContent = kind === 'win' ? 'Level ' + level + ' cleared' : 'Game over';
    $('ovText').textContent = 'Score ' + score + '  ·  Best ' + best;
    $('ovBtn').textContent = kind === 'win' ? 'Next level' : 'Play again';
    $('ovBtn').dataset.kind = kind;
    overlay.hidden = false;
    $('ovBtn').focus();
  }

  function fire() {
    if (state !== 'aim') return;
    state = 'fly';
    b = { x: SX, y: SY, vx: Math.cos(aim) * SPEED, vy: -Math.sin(aim) * SPEED, col: cur };
    cur = nxt; nxt = null;
  }

  function stepFlight(dt) {
    const dist = SPEED * dt, n = Math.max(1, Math.ceil(dist / (R / 3))), sd = dist / n;
    for (let i = 0; i < n; i++) {
      b.x += b.vx / SPEED * sd; b.y += b.vy / SPEED * sd;
      if (b.x < R) { b.x = R; b.vx = -b.vx; } else if (b.x > W - R) { b.x = W - R; b.vx = -b.vx; }
      if (b.y <= R || collide(b.x, b.y)) { land(); return; }
    }
  }

  function updateFx(dt) {
    for (const f of fx) {
      if (f.k === 'pop') f.t += dt / 0.25;
      else { f.vy += 1400 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
    }
    fx = fx.filter(f => f.k === 'pop' ? f.t < 1 : f.y < H + 40);
  }

  function glyph(x, y, i) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.78)'; ctx.strokeStyle = 'rgba(255,255,255,.78)'; ctx.lineWidth = 2;
    ctx.beginPath();
    switch (i) {
      case 0: ctx.arc(x, y, 3.4, 0, 7); ctx.fill(); break;
      case 1: ctx.arc(x, y, 4.6, 0, 7); ctx.stroke(); break;
      case 2: ctx.rect(x - 3.6, y - 3.6, 7.2, 7.2); ctx.fill(); break;
      case 3: ctx.moveTo(x, y - 5); ctx.lineTo(x + 4.6, y + 3.4); ctx.lineTo(x - 4.6, y + 3.4); ctx.closePath(); ctx.fill(); break;
      case 4: ctx.moveTo(x, y - 5); ctx.lineTo(x + 4.4, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 4.4, y); ctx.closePath(); ctx.fill(); break;
      default: ctx.moveTo(x - 4.4, y); ctx.lineTo(x + 4.4, y); ctx.moveTo(x, y - 4.4); ctx.lineTo(x, y + 4.4); ctx.stroke();
    }
    ctx.restore();
  }

  function bubble(x, y, i, r, a) {
    r = r || R; a = a == null ? 1 : a;
    const p = PAL[i];
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x, y);
    const k = r / R; ctx.scale(k, k);
    const g = ctx.createRadialGradient(-6, -8, 2, 0, 0, R);
    g.addColorStop(0, p[0]); g.addColorStop(.55, p[1]); g.addColorStop(1, p[2]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R - 1, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-6, -8, 5, 3, -.6, 0, 7); ctx.fill();
    glyph(0, 0, i);
    ctx.restore();
  }

  function guide() {
    let x = SX, y = SY, vx = Math.cos(aim), vy = -Math.sin(aim);
    ctx.save();
    ctx.fillStyle = '#eef1ff';
    for (let i = 0; i < 120; i++) {
      x += vx * 8; y += vy * 8;
      if (x < R) { x = R; vx = -vx; } else if (x > W - R) { x = W - R; vx = -vx; }
      if (y <= R || collide(x, y)) break;
      if (i > 3 && i % 3 === 0) {
        ctx.globalAlpha = Math.max(.15, .75 - i / 160);
        ctx.beginPath(); ctx.arc(x, y, 2.3, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = PANEL; ctx.fillRect(0, DANGER, W, H - DANGER);
    ctx.strokeStyle = DANGERC; ctx.globalAlpha = .7; ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(0, DANGER); ctx.lineTo(W, DANGER); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        const v = grid[r][c];
        if (v == null) continue;
        const [x, y] = cellPos(r, c);
        bubble(x, y, v);
      }
    }
    for (const f of fx) {
      if (f.k === 'pop') {
        bubble(f.x, f.y, f.col, R * (1 + f.t * .35), 1 - f.t);
        ctx.save();
        ctx.strokeStyle = PAL[f.col][0]; ctx.globalAlpha = (1 - f.t) * .8; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f.x, f.y, R * (1 + f.t * 1.2), 0, 7); ctx.stroke();
        ctx.restore();
      } else bubble(f.x, f.y, f.col);
    }

    if (state === 'aim') guide();

    ctx.save();
    ctx.strokeStyle = '#2b3250'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(SX, SY); ctx.lineTo(SX + Math.cos(aim) * 34, SY - Math.sin(aim) * 34); ctx.stroke();
    ctx.restore();
    if (cur != null) bubble(SX, SY, cur);
    if (nxt != null) {
      bubble(NX, NY, nxt, 14);
      ctx.fillStyle = '#8d96bd'; ctx.font = '500 10px "DM Mono", monospace'; ctx.textAlign = 'center';
      ctx.fillText('SWAP', NX, NY + 30);
    }
    if (b) bubble(b.x, b.y, b.col);
  }

  function fit() {
    const aw = stage.clientWidth, ah = stage.clientHeight;
    const s = Math.max(.2, Math.min(aw / W, ah / H));
    const w = Math.floor(W * s), h = Math.floor(H * s);
    frame.style.width = w + 'px'; frame.style.height = h + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }

  function setAim(x, y) {
    let a = Math.atan2(SY - y, x - SX);
    if (!(a > 0)) a = x < SX ? Math.PI : 0;
    aim = Math.min(Math.PI - .2, Math.max(.2, a));
  }
  const toLogical = e => {
    const rc = cv.getBoundingClientRect();
    return [(e.clientX - rc.left) * W / rc.width, (e.clientY - rc.top) * H / rc.height];
  };

  cv.addEventListener('pointerdown', e => {
    if (state !== 'aim') return;
    const [x, y] = toLogical(e);
    if (nxt != null && Math.hypot(x - NX, y - NY) < 28) { const t = cur; cur = nxt; nxt = t; return; }
    down = true; setAim(x, y);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', e => {
    if (state !== 'aim') return;
    if (down || e.pointerType === 'mouse') { const [x, y] = toLogical(e); setAim(x, y); }
  });
  cv.addEventListener('pointerup', e => {
    if (!down) return;
    down = false;
    const [x, y] = toLogical(e); setAim(x, y); fire();
  });
  cv.addEventListener('pointercancel', () => { down = false; });
  window.addEventListener('keydown', e => {
    if (state !== 'aim') return;
    if (e.key === 'ArrowLeft') aim = Math.min(Math.PI - .2, aim + .05);
    else if (e.key === 'ArrowRight') aim = Math.max(.2, aim - .05);
    else if (e.key === ' ' && document.activeElement === document.body) { e.preventDefault(); fire(); }
  });

  $('restart').addEventListener('click', newGame);
  $('ovBtn').addEventListener('click', () => {
    if ($('ovBtn').dataset.kind === 'win') { level++; startLevel(); } else newGame();
  });

  new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);
  fit();
  newGame();

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    if (state === 'fly' && b) stepFlight(dt);
    updateFx(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
