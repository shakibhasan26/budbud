<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131f">
<title>Budbud</title>
<style>
html, body { height: 100%; margin: 0; background: #10131f; color: #8d96bd; font: 600 15px system-ui, sans-serif; }
body { display: grid; place-items: center; }
</style>
</head>
<body>
<p>Loading Budbud...</p>
<script>
// Opens the newest online version of the game. With no internet it opens the copy inside the app.
var ONLINE = 'https://shakibhasan26.github.io/budbud/www/game.html';
var gone = false, timer = null;
function goOffline() { if (gone) return; gone = true; clearTimeout(timer); location.replace('game.html'); }
function goOnline() { if (gone) return; gone = true; clearTimeout(timer); location.replace(ONLINE + '?v=' + Math.floor(Date.now() / 60000)); }
timer = setTimeout(goOffline, 4000);
try {
  fetch(ONLINE, { cache: 'no-store' })
    .then(function (r) { if (r.ok) goOnline(); else goOffline(); })
    .catch(function () {
      fetch(ONLINE, { mode: 'no-cors', cache: 'no-store' }).then(goOnline, goOffline);
    });
} catch (e) { goOffline(); }
</script>
</body>
</html>
